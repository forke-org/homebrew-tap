name: Update formula

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (empty for the latest)
        required: false

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Write the formula for the latest forke-mail release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/update-formula.sh "${{ github.event.inputs.tag }}"
      - name: Push a branch when it changed
        run: |
          git diff --quiet && { echo "Formula already up to date"; exit 0; }
          version="$(sed -n 's#.*/releases/download/v\([^/]*\)/.*#\1#p' Formula/forke-mail.rb | head -1)"
          branch="formula/forke-mail-${version}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null; then
            echo "Branch ${branch} is already waiting for review"
            exit 0
          fi
          git config user.name "forke-mail-release"
          git config user.email "support@forke.space"
          git checkout -b "${branch}"
          git commit -qam "forke-mail ${version}"
          git push -q origin "${branch}"
          echo "Pushed ${branch}: open a pull request for it on GitHub"
